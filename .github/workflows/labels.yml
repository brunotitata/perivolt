name: Repository labels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/labels.yml']
  workflow_dispatch:
permissions:
  issues: read
concurrency:
  group: repository-labels
  cancel-in-progress: false
jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify existing taxonomy without rewriting it
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/labels?per_page=100" --jq '.[].name' > labels.txt
          for label in 'bug' 'enhancement' 'area:dashboard' 'area:native' 'qa-required' 'license-pending' 'priority:P0' 'priority:P1' 'priority:P2' 'area:domain' 'area:ui' 'area:hardware' 'area:release' 'area:docs'; do
            grep -Fxq "$label" labels.txt
          done
      - name: Verify existing milestone identities (P.O owns titles)
        run: |
          for number in 1 2 3; do
            gh api "repos/$GH_REPO/milestones/$number" --jq '[.number,.title,.due_on]'
          done
