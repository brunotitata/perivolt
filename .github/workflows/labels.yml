name: Repository labels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/labels.yml']
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: repository-labels
  cancel-in-progress: false
jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ensure administrative taxonomy (preserve existing labels)
        run: |
          gh label create bug --color d73a4a --description "Defeito reproduzível" --force
          gh label create enhancement --color a2eeef --description "Proposta para avaliação P.O" --force
          gh label create area:dashboard --color 0075ca --description "Dashboard Next separado do monitor" --force
          gh label create area:native --color 5319e7 --description "Monitor nativo C++" --force
          gh label create qa-required --color fbca04 --description "Aceite QA pendente" --force
          gh label create license-pending --color b60205 --description "Decisão de licença pendente" --force
          gh label create 'priority:P0' --color b60205 --description "Prioridade definida pelo P.O" --force
          gh label create 'priority:P1' --color d93f0b --description "Prioridade definida pelo P.O" --force
          gh label create 'priority:P2' --color fbca04 --description "Prioridade definida pelo P.O" --force
          gh label create 'area:domain' --color 0075ca --description "Componente domain" --force
          gh label create 'area:ui' --color 0075ca --description "Componente ui" --force
          gh label create 'area:hardware' --color 0075ca --description "Componente hardware" --force
          gh label create 'area:release' --color 0075ca --description "Componente release" --force
          gh label create 'area:docs' --color 0075ca --description "Componente docs" --force
      - name: Ensure milestones without due dates
        shell: bash
        run: |
          set -euo pipefail
          for title in 'M1 - Protótipo' 'M2 - MVP' 'M3 - Release candidato'; do
            number=$(gh api --paginate "repos/$GH_REPO/milestones?state=all&per_page=100" | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n1)
            if test -z "$number"; then
              gh api --method POST "repos/$GH_REPO/milestones" -f title="$title" --jq '[.number,.title]'
            else
              printf '%s: %s\n' "$number" "$title"
            fi
          done
